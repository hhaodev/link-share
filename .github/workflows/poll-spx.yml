name: Poll SPX shipments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification to all registered devices"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: poll-spx
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Poll shipments and send notifications
        run: npm run poll:spx
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_NOTIFICATION: ${{ inputs.test_notification && 'true' || 'false' }}
